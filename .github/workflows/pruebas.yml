# Pruebas automáticas en cada cambio.
#
# Antes de esto, las pruebas existían pero no las corría nadie: cada fusión a
# main se publicaba derecho a producción sin que nada las mirara. Así llegó a
# producción el error que devolvía las portadas al documento del tablero, que
# habría vuelto a agotar la cuota de salida de Supabase en pocos días.

name: Pruebas

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias
        run: npm install

      # Las pruebas abren la app de verdad en un navegador: sin esto no hay
      # con qué correrlas.
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      # El index.html del repositorio es un archivo generado. Si alguien lo
      # editó a mano, o se olvidó de regenerarlo, lo que se probaría acá no
      # sería lo que está publicado.
      - name: Verificar que index.html esté al día
        run: |
          node build.mjs
          if ! git diff --quiet -- index.html; then
            echo "::error::index.html no coincide con src/. Corré 'npm run build' y volvé a commitear."
            git diff --stat -- index.html
            exit 1
          fi

      - name: Sincronización entre dos personas
        run: node test/sync.test.mjs

      - name: Tamaño del documento sincronizado
        run: node test/tamano.test.mjs
