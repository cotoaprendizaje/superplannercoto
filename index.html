================================================================================
  COTONETES FOREVER · Aprendizaje e-Learning · RRHH COTO CICSA
  Fase 1 — Tablero (Kanban / Calendario / Timeline) + Mapa > Cursos
================================================================================
  VISIÓN (documentada, ejecución acotada a Fase 1):

  DOS PLANOS CONECTADOS
  - TABLERO  = "lo que hacemos": proyectos/tareas en movimiento.
  - MAPA     = "lo que tenemos": inventario navegable (Fase 1: Cursos).
  - PUENTE   = ciclo de vida: una tarjeta es UN objeto; su plano se DERIVA
               del estado. Un curso del tablero, al publicarse, aparece en el
               inventario; si necesita actualización vuelve al tablero. No se
               duplica data, se mueve la misma tarjeta entre vistas.

  MODELO: 3 EJES INDEPENDIENTES que se combinan
  - TIPO   -> trae una PLANTILLA editable (fases + checklist). Punto de partida.
  - ESTADO -> pendiente | en-desarrollo | en-revision | finalizado.
  - SECTOR -> sectores[] (uno o varios). Color vía data-cat (modelo Edu Point).

  SECCIONES DEL MAPA aún vacías (estructura lista p/ fases siguientes):
  apps web · QR/Edu Point inventario · bases del sistema.

  PERSISTENCIA: window.storage { shared:true }. Sin localStorage/sessionStorage.
  Identificación por nombre al entrar. try/catch + estados de carga.
  Fallback en memoria (modo demo) si window.storage no existe.
================================================================================

  --cat-4: #f0b446;
  --cat-5: #fac864;
  --cat-6: #fadc8c;
  --cat: #f0a032;
  --cat-strong: #c86400;
  --cat-soft: #fac864;
  --cat-grad: linear-gradient(135deg, #dc8c1e, #f0b446);
  --on-cat: #1e2d46;
}
[data-cat="zona-e"] {
  --cat-1: #1e1e1e;
  --cat-2: #3c3c3c;
  --cat-3: #5a5a5a;
  --cat-4: #6e6e6e;
  --cat-5: #8c8c8c;
  --cat-6: #aaaaaa;
  --cat: #5a5a5a;
  --cat-strong: #1e1e1e;
  --cat-soft: #8c8c8c;
  --cat-grad: linear-gradient(135deg, #3c3c3c, #6e6e6e);
  --on-cat: #ffffff;
}
[data-cat="zona-gourmet"] {
  --cat-1: #1e1e1e;
  --cat-2: #505050;
  --cat-3: #cd1e1e;
  --cat: #cd1e1e;
  --cat-strong: #1e1e1e;
  --cat-soft: #505050;
  --cat-grad: linear-gradient(135deg, #505050, #cd1e1e);
  --on-cat: #ffffff;
}
[data-cat="zona-cumples"] {
  --cat-1: #e66e0a;
  --cat-2: #bed20a;
  --cat-3: #6e328c;
  --cat: #6e328c;
  --cat-strong: #e66e0a;
  --cat-soft: #bed20a;
  --cat-grad: linear-gradient(135deg, #bed20a, #6e328c);
  --on-cat: #ffffff;
}
[data-cat="aprendizaje"] {
  --cat-1: #003c56;
  --cat-2: #005478;
  --cat-3: #006ea0;
  --cat-4: #1e8ac8;
  --cat-5: #50aae0;
  --cat-6: #82c4ee;
  --cat: #006ea0;
  --cat-strong: #003c56;
  --cat-soft: #50aae0;
  --cat-grad: linear-gradient(135deg, #005478, #1e8ac8);
  --on-cat: #ffffff;
}
:root {
  --titulo: "Faible", "Roboto", system-ui, "Segoe UI", sans-serif;
  --texto: "Roboto", system-ui, "Segoe UI", sans-serif;
  --coto-blue: #006ea0;
  --coto-navy: #1e2d46;
  /* El header es navy sólido siempre, prenda o no prenda el modo oscuro:
     ancla de marca fija, no cambia con el tema de la página. */
  --chrome-bg: #0e1c30;
  --chrome-line: rgba(255, 255, 255, 0.14);
  --chrome-ink: #f5f8fd;
  --chrome-ink-soft: #a9b8d6;
  --coto-white: #ebf0ff;
  /* Antes casi invisible (#e4e9f2 sobre blanco): las cajas flotaban sin
     borde real y dependían de una sombra al 5% de opacidad para separarse
     del fondo. Ahora el borde hace el trabajo por sí solo. */
  --line: #c7d1e3;
  --line-soft: #dde4f0;
  --coto-blue-deep: #00466e;
  --coto-chambray: #96a5be;
  --bg: #e7ecf6;
  --surface: #ffffff;
  --surface-2: #eef2fa;
  --ink: var(--coto-navy);
  --ink-soft: #465269;
  --link: var(--coto-blue);
  --grad-brand: linear-gradient(
    135deg,
    var(--coto-blue-deep),
    var(--coto-blue)
  );
  --shadow-sm:
    0 1px 2px rgba(20, 32, 56, 0.08), 0 1px 3px rgba(20, 32, 56, 0.06);
  --shadow:
    0 3px 10px rgba(20, 32, 56, 0.08), 0 14px 32px rgba(20, 32, 56, 0.1);
  --shadow-lg:
    0 16px 32px rgba(20, 32, 56, 0.14), 0 40px 76px rgba(20, 32, 56, 0.2);
  --r-sm: 12px;
  --r-s: 16px;
  --r-l: 22px;
  --pill: 999px;
  --r-xl: 30px;
  --r-squircle: 22px;
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --spring: cubic-bezier(0.34, 1.4, 0.5, 1);
  /* El "glassmorphism" (fondo translúcido + blur) se saca acá, en el
     origen: --glass/--glass-2/--glass-brd/--blur alimentan ~50 reglas más
     abajo en el archivo. En vez de tocarlas una por una, se redefinen
     estas cuatro como sólidas y sin desenfoque — todo lo que las usa pasa
     a ser opaco y nítido de una. Vidrio translúcido = todo se ve suave y
     lavado, lo contrario de la fuerza y el contraste que se pidió. */
  --glass: var(--surface);
  --glass-2: var(--surface-2);
  --glass-brd: var(--line);
  --glow: 0 18px 50px rgba(0, 120, 180, 0.2);
  --ambient: 0 18px 40px -26px rgba(0, 110, 160, 0.55);
  --blur: none;
  --ok: #2e9e8f;
  --ok-soft: #e3f3f0;
  --warn: #e2a03f;
  --bad: #d8553f;
  --bad-soft: #fbe7e1;
}
[data-theme="dark"] {
  /* Menos "navy lavado", más carbón: que los acentos de color salten en
     vez de competir con un fondo azul medio. */
  --bg: #090e17;
  --surface: #121b2c;
  --surface-2: #1f2b46;
  --ink: #eaf0fb;
  --ink-soft: #a3b0c8;
  --line: #3c4b6c;
  --line-soft: #2b3752;
  --coto-white: #0e1521;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.36);
  --shadow: 0 3px 10px rgba(0, 0, 0, 0.34), 0 14px 34px rgba(0, 0, 0, 0.42);
  --shadow-lg: 0 16px 34px rgba(0, 0, 0, 0.48), 0 40px 76px rgba(0, 0, 0, 0.58);
  --glass: var(--surface);
  --glass-2: var(--surface-2);
  --glass-brd: var(--line);
  --glow: 0 20px 54px rgba(38, 179, 232, 0.28);
  --ambient: 0 18px 44px -24px rgba(38, 179, 232, 0.5);
  --blur: none;
  --ok-soft: #17332e;
  --bad-soft: #3a201b;
}
* {
  box-sizing: border-box;
}
body,
html {
  margin: 0;
  height: 100%;
}
body {
  font-family: var(--texto);
  color: var(--ink);
  background:
    radial-gradient(
      1100px 620px at 100% -8%,
      color-mix(in srgb, var(--coto-blue) 10%, transparent),
      transparent 60%
    ),
    radial-gradient(
      820px 520px at -8% 108%,
      color-mix(in srgb, var(--coto-navy) 7%, transparent),
      transparent 55%
    ),
    var(--bg);
  line-height: 1.5;
  letter-spacing: -0.01em;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  background:
    radial-gradient(
      760px 520px at 96% -8%,
      color-mix(in srgb, #0096d2 32%, transparent),
      transparent 58%
    ),
    radial-gradient(
      620px 480px at 78% 0,
      color-mix(in srgb, #26b3e8 22%, transparent),
      transparent 55%
    ),
    radial-gradient(
      640px 520px at -8% 8%,
      color-mix(in srgb, #6e328c 16%, transparent),
      transparent 55%
    ),
    radial-gradient(
      900px 720px at 50% 122%,
      color-mix(in srgb, var(--coto-navy) 18%, transparent),
      transparent 56%
    ),
    var(--bg);
  background-attachment: fixed;
}
h1,
h2,
h3,
h4 {
  font-family: var(--titulo);
  font-weight: 900;
  margin: 0;
  letter-spacing: -0.022em;
  line-height: 1.12;
}
a {
  color: var(--link);
  text-decoration: none;
}
button {
  font-family: inherit;
}
.hidden {
  display: none !important;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  cursor: pointer;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  padding: 8px 15px;
  border-radius: var(--pill);
  font-size: 13px;
  font-weight: 600;
  transition:
    transform 0.2s var(--spring),
    background 0.2s var(--ease),
    border-color 0.2s var(--ease),
    box-shadow 0.2s var(--ease),
    filter 0.2s var(--ease);
  white-space: nowrap;
}
.btn:hover {
  border-color: color-mix(in srgb, var(--coto-blue) 45%, var(--line));
  transform: translateY(-1px);
  box-shadow: var(--shadow-sm);
}
.btn:active {
  transform: translateY(0) scale(0.97);
}
.btn-primary {
  background: var(--grad-brand);
  border-color: transparent;
  color: #fff;
  box-shadow: 0 2px 8px color-mix(in srgb, var(--coto-blue) 28%, transparent);
}
.btn-primary:hover {
  filter: brightness(1.06);
  border-color: transparent;
  box-shadow: 0 5px 16px color-mix(in srgb, var(--coto-blue) 40%, transparent);
}
.btn-ghost {
  background: 0 0;
  border-color: transparent;
  box-shadow: none;
}
.btn-ghost:hover {
  background: color-mix(in srgb, var(--ink) 6%, transparent);
  border-color: transparent;
  box-shadow: none;
}
.btn-sm {
  padding: 5px 11px;
  font-size: 12px;
}
.btn-icon {
  padding: 8px;
  width: 38px;
  height: 38px;
  justify-content: center;
  border-radius: 50%;
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: var(--pill);
  font-size: 11.5px;
  font-weight: 600;
  background: var(--surface-2);
  color: var(--ink-soft);
  border: 1px solid var(--line);
}
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 9px;
  border-radius: var(--pill);
  font-size: 11px;
  font-weight: 600;
  line-height: 1.4;
}
.badge-cat {
  background: var(--cat);
  color: var(--on-cat);
  border: none;
  font-weight: 700;
}
.badge-tbd {
  background: var(--surface-2);
  color: var(--ink-soft);
  border: 1px dashed var(--line);
}
.prio {
  background: var(--bad);
  color: #fff;
  border-color: transparent;
  font-weight: 700;
}
.tipo-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--ink-soft);
  padding: 2px 4px;
}
.app {
  min-height: 100%;
  display: flex;
  flex-direction: column;
}
.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  gap: 18px;
  flex-wrap: wrap;
  background: color-mix(in srgb, var(--surface) 70%, transparent);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid color-mix(in srgb, var(--line) 65%, transparent);
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-right: auto;
}
.logo-lockup {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  background: var(--coto-navy);
  border-radius: var(--pill);
  padding: 5px 12px;
  box-shadow: var(--shadow);
}
.logo-img {
  height: 24px;
  width: auto;
  display: block;
}
.logo-div {
  width: 1px;
  height: 18px;
  background: #fff;
  opacity: 0.25;
}
.gate .logo-lockup {
  padding: 8px 16px;
  gap: 12px;
}
.gate .logo-img {
  height: 34px;
}
.hub-hero .logo-lockup {
  padding: 7px 16px;
  gap: 11px;
}
.hub-hero .logo-img {
  height: 28px;
}
.brand-mark {
  width: 42px;
  height: 42px;
  border-radius: var(--r-sm);
  background: linear-gradient(135deg, var(--coto-blue), var(--coto-navy));
  position: relative;
  box-shadow: var(--shadow);
  flex: none;
}
.brand-mark::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: var(--r-sm);
  background: radial-gradient(
      circle at 30% 30%,
      rgba(255, 255, 255, 0.5) 1.5px,
      transparent 2px
    )
    0 0/9px 9px;
}
.brand-k {
  font-size: 11px;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  color: var(--ink-soft);
  font-weight: 600;
}
.brand-t {
  font-family: var(--titulo);
  font-weight: 900;
  line-height: 1.05;
  letter-spacing: -0.3px;
}
.tabs {
  display: flex;
  align-items: center;
  gap: 3px;
  background: color-mix(in srgb, var(--coto-navy) 6%, var(--surface-2));
  padding: 4px;
  border-radius: var(--pill);
  border: 1px solid var(--line-soft);
}
.tabs .sep {
  width: 1px;
  height: 18px;
  background: var(--line);
  margin: 0 4px;
  opacity: 0.7;
}
.tab {
  cursor: pointer;
  border: none;
  background: 0 0;
  color: var(--ink-soft);
  padding: 7px 14px;
  border-radius: var(--pill);
  font-size: 13px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
  transition:
    color 0.2s var(--ease),
    background 0.28s var(--spring),
    box-shadow 0.28s var(--ease),
    transform 0.2s var(--spring);
}
.tab:hover {
  color: var(--ink);
}
.tab:active {
  transform: scale(0.95);
}
.tab.active {
  background: var(--surface);
  color: var(--coto-blue);
  box-shadow:
    var(--shadow-sm),
    0 0 0 1px var(--line-soft);
}
.top-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}
.userchip {
  display: flex;
  align-items: center;
  gap: 8px;
  border-radius: var(--pill);
  background: var(--surface);
  border: 1px solid var(--line);
  cursor: pointer;
  font-size: 13px;
  transition: 0.15s;
}
.userchip:hover {
  border-color: var(--coto-blue);
}
.menu-wrap {
  position: relative;
}
.menu {
  position: absolute;
  right: 0;
  top: calc(100% + 8px);
  min-width: 206px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-s);
  box-shadow: var(--shadow-lg);
  padding: 6px;
  z-index: 45;
  animation: 0.16s viewIn;
}
.menu-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  text-align: left;
  border: none;
  background: 0 0;
  color: var(--ink);
  font-family: inherit;
  font-size: 13.5px;
  font-weight: 500;
  padding: 9px 11px;
  border-radius: 9px;
  cursor: pointer;
}
.menu-item:hover {
  background: var(--surface-2);
}
.menu-item > span:first-child {
  width: 18px;
  text-align: center;
  opacity: 0.85;
}
.menu-flag {
  margin-left: auto;
  font-size: 10px;
  font-weight: 800;
  color: var(--coto-blue);
  letter-spacing: 0.5px;
}
.menu-sep {
  height: 1px;
  background: var(--line);
  margin: 5px 4px;
}
.fab {
  position: fixed;
  right: 26px;
  bottom: 26px;
  z-index: 38;
  width: 58px;
  height: 58px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  background: var(--grad-brand);
  color: #fff;
  font-size: 30px;
  font-weight: 400;
  line-height: 1;
  display: grid;
  place-items: center;
  box-shadow: 0 10px 26px rgba(0, 110, 160, 0.42);
  transition:
    transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1),
    box-shadow 0.18s;
}
.fab:hover {
  transform: translateY(-3px) scale(1.05);
  box-shadow: 0 14px 34px rgba(0, 110, 160, 0.5);
}
.fab:active {
  transform: scale(0.95);
}
.view-head {
  margin: 0 0 16px;
}
.view-head h2 {
  font-size: 28px;
  letter-spacing: -0.5px;
  color: var(--ink);
}
.view-head p {
  margin: 3px 0 0;
  color: var(--ink-soft);
  font-size: 13px;
}
.avatar {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  flex: none;
  box-shadow: 0 0 0 2px var(--surface);
}
.avatar.sm {
  width: 22px;
  height: 22px;
  font-size: 10px;
}
#banner {
  padding: 4px 22px 16px;
  margin-top: auto;
}
.note {
  margin: 0;
  padding: 6px 12px;
  border-radius: var(--pill);
  font-size: 12px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-soft);
  display: inline-flex;
  gap: 8px;
  align-items: center;
}
.note.warn {
  background: #fff7e8;
  border-color: #f0d79a;
  color: #8a6a1f;
}
[data-theme="dark"] .note.warn {
  background: #2a2412;
  border-color: #4d421f;
  color: #e0c074;
}
.filters {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  padding: 14px 22px 6px;
}
.filt {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--pill);
  padding: 5px 6px 5px 12px;
  font-size: 12.5px;
  color: var(--ink-soft);
}
.filt input,
.filt select {
  border: none;
  background: 0 0;
  color: var(--ink);
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  outline: 0;
  padding: 3px 6px;
  border-radius: var(--pill);
}
.filt input {
  min-width: 150px;
}
.filt-clear {
  margin-left: auto;
}
.filt-pop-wrap {
  position: relative;
}
.filt-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  margin-left: 5px;
  border-radius: var(--pill);
  background: var(--coto-blue);
  color: #fff;
  font-size: 10.5px;
  font-weight: 800;
}
.filt-pop {
  position: absolute;
  left: 0;
  top: calc(100% + 8px);
  min-width: 240px;
  max-width: 300px;
  max-height: 70vh;
  overflow-y: auto;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-s);
  box-shadow: var(--shadow-lg);
  padding: 12px;
  z-index: 45;
  display: flex;
  flex-direction: column;
  gap: 8px;
  animation: 0.16s viewIn;
}
.filt-pop-item {
  width: 100%;
}
.filt-pop-item select {
  flex: 1;
}
.filt-pop-sep {
  height: 1px;
  background: var(--line);
  margin: 2px 0;
}
.filt-pop-label {
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.qchips-pop {
  gap: 6px;
}
.view {
  padding: 14px 22px 60px;
  flex: 1;
}
.kanban {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
  align-items: start;
}
.kcol {
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--r-l);
  padding: 12px;
  min-height: 180px;
}
.kcol-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 2px 4px 12px;
}
.kcol-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
}
.kcol-head h3 {
  font-size: 14px;
}
.kcol-count {
  margin-left: auto;
  font-size: 12px;
  font-weight: 700;
  color: var(--ink-soft);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--pill);
  padding: 1px 9px;
}
.kcol-body {
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: 40px;
}
.kcol-body.drop {
  outline: 2px dashed var(--coto-blue);
  outline-offset: 3px;
  border-radius: var(--r-s);
}
.kcard {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-l);
  padding: 13px 14px;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: 0.15s;
  position: relative;
  border-left: 6px solid var(--cat, var(--line));
}
.kcard:hover {
  box-shadow: var(--shadow-lg);
}
.kcard.drag {
  opacity: 0.4;
}
.kcard-top {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}
.kcard-title {
  font-family: var(--texto);
  font-size: 14.5px;
  font-weight: 700;
  letter-spacing: -0.1px;
  line-height: 1.32;
  margin: 3px 0 9px;
}
.badges {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-bottom: 9px;
}
.kcard-meta {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px 10px;
  font-size: 12px;
  color: var(--ink-soft);
  margin-bottom: 8px;
}
.date {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.date.overdue {
  color: var(--bad);
  font-weight: 700;
}
.date.rev-age {
  color: #b47a00;
  font-weight: 600;
}
.progress {
  height: 8px;
  border-radius: var(--pill);
  background: var(--surface-2);
  overflow: hidden;
  flex: 1;
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.07);
}
.progress-bar {
  height: 100%;
  border-radius: var(--pill);
  background: linear-gradient(
    90deg,
    var(--cat, var(--coto-blue)),
    color-mix(in srgb, var(--cat, var(--coto-blue)) 65%, white)
  );
  transition: width 0.3s;
}
.prog-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 2px;
}
.prog-num {
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-soft);
  white-space: nowrap;
}
.kcard-foot {
  display: flex;
  align-items: center;
  margin-top: 9px;
}
.stack {
  display: flex;
}
.stack-empty {
  border: 1px dashed var(--line);
  background: var(--surface-2);
  color: var(--ink-soft);
  border-radius: 50%;
  width: 26px;
  height: 26px;
  display: grid;
  place-content: center;
  font-size: 13px;
  cursor: pointer;
  transition:
    transform 0.12s ease,
    border-color 0.12s ease;
}
.stack-empty:hover {
  transform: scale(1.1);
  border-color: var(--coto-blue);
}
.stack .avatar {
  margin-left: -7px;
}
.stack .avatar:first-child {
  margin-left: 0;
}
.tag-flag {
  position: absolute;
  top: 10px;
  right: 10px;
  font-size: 10px;
  font-weight: 700;
  color: var(--coto-blue);
}
.cal-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}
.cal-title {
  font-family: var(--titulo);
  font-size: 18px;
  text-transform: capitalize;
  min-width: 190px;
}
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 8px;
}
.cal-dow {
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-soft);
  text-transform: uppercase;
}
.cal-cell {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-s);
  padding: 7px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.cal-cell.out {
  background: var(--surface-2);
  opacity: 0.6;
}
.cal-cell.today {
  border-color: var(--coto-blue);
  box-shadow: 0 0 0 1px var(--coto-blue) inset;
}
.cal-day {
  font-size: 12px;
  font-weight: 700;
  color: var(--ink-soft);
}
.cal-cell.today .cal-day {
  color: var(--coto-blue);
}
.cal-week {
  grid-template-columns: repeat(7, 1fr);
}
.cal-chip {
  font-weight: 600;
  background: var(--cat-soft);
  color: var(--cat-strong);
  border-left: 3px solid var(--cat);
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.cal-chip.overdue {
  box-shadow: inset 0 0 0 1px var(--bad);
}
.cal-more {
  font-size: 11px;
  color: var(--ink-soft);
  cursor: pointer;
  font-weight: 600;
}
.tl-wrap {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-l);
  overflow: hidden;
  box-shadow: var(--shadow);
}
.tl-grid {
  display: flex;
}
.tl-left {
  flex: none;
  width: 230px;
  border-right: 1px solid var(--line);
  background: var(--surface);
  z-index: 2;
}
.tl-right {
  flex: 1;
  overflow-x: auto;
  position: relative;
}
.tl-corner,
.tl-months {
  height: 46px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
}
.tl-corner {
  padding: 0 14px;
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-soft);
  text-transform: uppercase;
}
.tl-months {
  position: relative;
}
.tl-month {
  position: absolute;
  top: 0;
  height: 46px;
  border-left: 1px solid var(--line);
  display: flex;
  align-items: center;
  padding: 0 10px;
  font-size: 12px;
  font-weight: 700;
  color: var(--ink-soft);
  text-transform: capitalize;
}
.tl-rows-left .tl-rl {
  padding: 0 14px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 9px;
}
.tl-rl-title {
  font-size: 13px;
  font-weight: 600;
  line-height: 1.15;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.tl-rl-sub {
  font-size: 11px;
  color: var(--ink-soft);
}
.tl-track {
  position: relative;
  border-bottom: 1px solid var(--line);
}
.tl-bar {
  position: absolute;
  height: 22px;
  border-radius: var(--pill);
  background: var(--cat, var(--coto-blue));
  box-shadow: var(--shadow);
  cursor: pointer;
  display: flex;
  align-items: center;
  padding: 0 9px;
  overflow: hidden;
}
.tl-bar span {
  font-size: 11px;
  font-weight: 600;
  color: var(--on-cat);
  white-space: nowrap;
  pointer-events: none;
}
.tl-bar.overdue {
  box-shadow: 0 0 0 2px var(--bad);
}
.tl-fase {
  position: absolute;
  height: 11px;
  border-radius: var(--pill);
  background: color-mix(in srgb, var(--cat) 55%, #fff);
  border: 1px solid var(--cat);
}
.tl-today {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 2px;
  background: var(--bad);
  z-index: 3;
}
.tl-today::after {
  content: "hoy";
  position: absolute;
  top: 2px;
  left: 4px;
  font-size: 10px;
  font-weight: 700;
  color: var(--bad);
}
.cursos-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 16px;
}
.curso {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-l);
  overflow: hidden;
  box-shadow: var(--shadow);
  transition: 0.15s;
  cursor: pointer;
  display: flex;
  flex-direction: column;
}
.curso:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-lg);
}
.curso-img {
  height: 118px;
  background: var(
    --cat-grad,
    linear-gradient(135deg, var(--cat), var(--cat-strong))
  );
  position: relative;
  display: flex;
  align-items: flex-end;
  padding: 10px;
}
.curso-img::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(
      circle at 80% 20%,
      rgba(255, 255, 255, 0.35) 1.5px,
      transparent 2px
    )
    0 0/14px 14px;
}
.curso-img img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.curso-estado {
  position: relative;
  z-index: 1;
  font-size: 10.5px;
  font-weight: 700;
  padding: 3px 9px;
  border-radius: var(--pill);
  background: rgba(255, 255, 255, 0.9);
  color: var(--cat-strong);
}
.curso-estado.upd {
  background: #fff;
  color: var(--warn);
}
.curso-body {
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 7px;
  flex: 1;
}
.curso-body h4 {
  font-size: 15px;
  line-height: 1.2;
}
.curso-bajada {
  font-size: 12.5px;
  color: var(--ink-soft);
  line-height: 1.35;
  flex: 1;
}
.curso-foot {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11.5px;
  color: var(--ink-soft);
  flex-wrap: wrap;
}
.curso-foot .moodle {
  margin-left: auto;
  font-weight: 700;
}
.mapa-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 10px;
  margin: 4px 0 18px;
}
.mapa-stat {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  padding: 14px 16px;
  border-radius: var(--r-l);
  background: var(--surface);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
}
.mapa-stat-ic {
  font-size: 18px;
  margin-bottom: 2px;
}
.mapa-stat-n {
  font-family: var(--titulo);
  font-size: 24px;
  font-weight: 900;
  color: var(--coto-navy);
  line-height: 1;
}
[data-theme="dark"] .mapa-stat-n {
  color: var(--ink);
}
.mapa-stat-l {
  font-size: 11.5px;
  color: var(--ink-soft);
  font-weight: 600;
}
.mapa-secciones {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin: 4px 0 18px;
}
.mapa-sec {
  padding: 8px 14px;
  border-radius: var(--pill);
  border: 1px solid var(--line);
  background: var(--surface);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.mapa-sec.active {
  border-color: var(--coto-blue);
  color: var(--coto-blue);
}
.overlay {
  position: fixed;
  inset: 0;
  backdrop-filter: blur(3px);
  z-index: 40;
}
.panel {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -47%) scale(0.98);
  opacity: 0;
  pointer-events: none;
  width: min(880px, 96vw);
  max-height: 92vh;
  background: var(--surface);
  z-index: 50;
  border: 1px solid var(--line);
  border-radius: var(--r-l);
  box-shadow: var(--shadow-lg);
  display: flex;
  flex-direction: column;
  transition:
    opacity 0.2s,
    transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.panel.open {
  transform: translate(-50%, -50%) scale(1);
  opacity: 1;
  pointer-events: auto;
}
.panel-head {
  border-radius: var(--r-l) var(--r-l) 0 0;
}
.sec-selected {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 8px;
  min-height: 6px;
}
.sec-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  font-weight: 700;
  padding: 4px 6px 4px 11px;
  border-radius: var(--pill);
  background: var(--cat);
  color: var(--on-cat);
  border: none;
}
.sec-x {
  cursor: pointer;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: color-mix(in srgb, var(--on-cat) 22%, transparent);
  color: var(--on-cat);
  font-size: 12px;
  line-height: 1;
}
.sec-x:hover {
  background: var(--on-cat);
  color: var(--cat);
}
.sec-search {
  position: relative;
}
.sec-search input {
  width: 100%;
  font-family: inherit;
  font-size: 13.5px;
  color: var(--ink);
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  padding: 9px 11px;
  outline: 0;
}
.sec-search input:focus {
  border-color: var(--coto-blue);
}
.sec-results {
  display: flex;
  flex-direction: column;
  gap: 2px;
  margin-top: 6px;
  max-height: 172px;
  overflow-y: auto;
}
.sec-opt {
  display: flex;
  align-items: center;
  gap: 9px;
  width: 100%;
  text-align: left;
  border: none;
  background: 0 0;
  cursor: pointer;
  font-family: inherit;
  font-size: 13px;
  color: var(--ink);
  padding: 7px 9px;
  border-radius: 8px;
}
.sec-opt:hover {
  background: var(--surface-2);
}
.sec-opt .sec-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--cat);
  flex: none;
}
.sec-none {
  font-size: 12px;
  color: var(--ink-soft);
  padding: 6px 9px;
}
.sec-create {
  color: var(--coto-blue);
  font-weight: 600;
  border-top: 1px solid var(--line);
  margin-top: 2px;
  padding-top: 9px;
}
.sec-create:hover {
  background: color-mix(in srgb, var(--coto-blue) 10%, transparent);
}
.acc {
  border-top: 1px dashed transparent;
}
.acc > summary {
  cursor: pointer;
  list-style: none;
  border-radius: var(--r-sm);
  padding: 6px 8px;
  margin: 0 -8px;
  transition: background 0.15s ease;
}
.acc > summary:hover {
  background: var(--surface-2);
}
.acc > summary::-webkit-details-marker {
  display: none;
}
.acc > summary::after {
  content: "▸";
  margin-left: auto;
  transition: transform 0.15s;
  display: inline-block;
  color: var(--ink-soft);
}
.acc[open] > summary::after {
  transform: rotate(90deg);
  color: var(--cat, var(--coto-blue));
}
.sec-acc {
  border-top: 1px solid var(--line);
  padding-top: 14px;
}
.sec-acc > summary {
  margin-top: 0;
}
.acc-body {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: 10px;
}
.fld-hint {
  font-size: 11px;
  color: var(--ink-soft);
  margin-top: 1px;
}
/* El header del panel ahora lleva el color del sector de la tarjeta: de
   un vistazo, sin leer nada, se sabe a qué sector pertenece lo que se
   está editando. Sin sector, cae al celeste de marca. */
.panel-head {
  padding: 16px 18px;
  background: var(--cat, var(--coto-blue));
  color: var(--on-cat, #fff);
  border-bottom: none;
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.panel-head .tipo-pill {
  color: var(--on-cat, #fff);
  opacity: 0.9;
}
.panel-head input[data-field="titulo"] {
  color: var(--on-cat, #fff);
  background: color-mix(in srgb, var(--on-cat, #fff) 14%, transparent);
  border-radius: var(--r-sm);
  padding: 4px 8px;
  margin-left: -8px;
}
.panel-head input[data-field="titulo"]::placeholder {
  color: color-mix(in srgb, var(--on-cat, #fff) 60%, transparent);
}
.panel-head .btn-ghost {
  color: var(--on-cat, #fff);
}
.panel-head .btn-ghost:hover {
  background: color-mix(in srgb, var(--on-cat, #fff) 16%, transparent);
}
.panel-head .savestate {
  background: rgba(255, 255, 255, 0.92);
  border-color: transparent;
}
.panel-headtop {
  display: flex;
  align-items: center;
  gap: 10px;
}
.savestate {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11.5px;
  font-weight: 700;
  padding: 4px 9px;
  border-radius: var(--pill);
  white-space: nowrap;
  color: var(--ink-soft);
  background: var(--surface-2);
  border: 1px solid var(--line);
}
.savestate::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  flex: none;
}
.savestate.saving {
  color: var(--ink-soft);
  animation: savestate-pulse 1s ease-in-out infinite;
}
.savestate.saved {
  color: var(--ok);
  background: var(--ok-soft);
  border-color: color-mix(in srgb, var(--ok) 35%, transparent);
}
.savestate.error {
  color: var(--bad);
  background: var(--bad-soft);
  border-color: color-mix(in srgb, var(--bad) 35%, transparent);
}
@keyframes savestate-pulse {
  0%,
  100% {
    opacity: 1;
  }
  50% {
    opacity: 0.5;
  }
}
.panel-body {
  padding: 16px 18px;
  overflow-y: auto;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.fld {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.fld label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  color: var(--ink-soft);
}
.fld input,
.fld select,
.fld textarea {
  font-family: inherit;
  font-size: 13.5px;
  color: var(--ink);
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  padding: 9px 11px;
  outline: 0;
  width: 100%;
}
.fld input:focus,
.fld select:focus,
.fld textarea:focus {
  border-color: var(--coto-blue);
}
.fld textarea {
  resize: vertical;
  min-height: 62px;
}
.fld-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.chiplist {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.chip-toggle {
  cursor: pointer;
  font-size: 11.5px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: var(--pill);
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--ink-soft);
  user-select: none;
}
.chip-toggle.on {
  background: var(--cat);
  color: #fff;
  border-color: var(--cat);
  box-shadow: 0 1px 5px color-mix(in srgb, var(--cat) 45%, transparent);
  font-weight: 700;
}
.chip-toggle.on::before {
  content: "✓";
  font-size: 10px;
  margin-right: 4px;
  opacity: 0.9;
}
.chk {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 8px;
  border-bottom: none;
  border-radius: var(--r-sm);
  transition: background 0.15s ease;
}
.chk:hover {
  background: var(--surface-2);
}
.chk input[type="checkbox"] {
  appearance: none;
  -webkit-appearance: none;
  width: 19px;
  height: 19px;
  border-radius: 6px;
  border: 2px solid var(--line);
  background: var(--surface);
  flex: none;
  cursor: pointer;
  display: grid;
  place-content: center;
  transition:
    background 0.15s ease,
    border-color 0.15s ease;
}
.chk input[type="checkbox"]::before {
  content: "";
  width: 10px;
  height: 10px;
  clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
  background: #fff;
  transform: scale(0);
  transition: transform 0.12s ease;
}
.chk input[type="checkbox"]:checked {
  background: var(--cat, var(--coto-blue));
  border-color: var(--cat, var(--coto-blue));
}
.chk input[type="checkbox"]:checked::before {
  transform: scale(1);
}
.chk .chk-text {
  flex: 1;
  font-size: 13.5px;
  background: 0 0;
  border: none;
  color: var(--ink);
  outline: 0;
  border-radius: 6px;
  padding: 3px 4px;
  margin: -3px -4px;
}
.chk .chk-text:focus {
  background: var(--surface);
  box-shadow: inset 0 0 0 1px var(--line);
}
.chk .chk-text.done {
  text-decoration: line-through;
  color: var(--ink-soft);
}
.chk-del {
  cursor: pointer;
  color: var(--ink-soft);
  opacity: 0.55;
  font-size: 13px;
  width: 22px;
  height: 22px;
  flex: none;
  display: grid;
  place-content: center;
  border-radius: 7px;
  transition:
    opacity 0.15s ease,
    background 0.15s ease,
    color 0.15s ease;
}
.chk-del:hover {
  color: #fff;
  background: var(--bad);
  opacity: 1;
}
.sub {
  font-size: 11.5px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--ink-soft);
  display: flex;
  align-items: center;
  gap: 8px;
}
.sub .ring {
  flex: 1;
  height: 1px;
  background: var(--line);
}
.fase-box {
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  padding: 10px;
  background: var(--surface-2);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.bridge {
  background: linear-gradient(
    135deg,
    color-mix(in srgb, var(--coto-blue) 10%, var(--surface)),
    var(--surface)
  );
  border: 1px solid color-mix(in srgb, var(--coto-blue) 30%, var(--line));
  border-radius: var(--r-s);
  padding: 13px;
  display: flex;
  flex-direction: column;
  gap: 9px;
}
.bridge .bridge-t {
  font-size: 12px;
  font-weight: 700;
  color: var(--coto-blue);
  display: flex;
  align-items: center;
  gap: 6px;
}
.bridge .bridge-d {
  font-size: 12px;
  color: var(--ink-soft);
  line-height: 1.4;
}
.carga-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.carga-row {
  display: flex;
  align-items: center;
  gap: 12px;
}
.carga-info {
  flex: 1;
}
.carga-name {

.topbar::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;

    color-mix(in srgb, var(--coto-blue) 38%, transparent) 50%,

.userchip {
  padding: 4px 13px 4px 5px;

/* El halo decorativo de fondo (dos manchas de color difuminadas, animadas)
   se sacó: competía con las cajas por atención y le restaba nitidez al
   conjunto. El fondo ahora es liso. */
.aurora {
  display: none;
}
@keyframes auroraDrift {
  0% {
    transform: translate3d(0, 0, 0) scale(1);
    opacity: 0.7;
  }
  100% {
    transform: translate3d(2.5%, -2%, 0) scale(1.1);
    opacity: 1;
  }
}
.app {
  position: relative;
  z-index: 1;
}
.gate {
  z-index: 80;
}
[data-theme="dark"] .aurora {
  opacity: 1;
  background:
    radial-gradient(
      40% 44% at 80% 14%,
      rgba(38, 179, 232, 0.3),
      transparent 68%
    ),
    radial-gradient(
      36% 42% at 16% 90%,
      rgba(0, 110, 160, 0.26),
      transparent 70%
    );
}
[data-theme="dark"] body {
  background:
    radial-gradient(
      760px 520px at 96% -8%,
      rgba(38, 179, 232, 0.18),
      transparent 58%
    ),
    radial-gradient(
      640px 520px at -8% 8%,
      rgba(110, 50, 140, 0.14),
      transparent 55%
    ),
    radial-gradient(
      900px 720px at 50% 122%,
      rgba(0, 70, 110, 0.22),
      transparent 56%
    ),
    var(--bg);
}
.tab.active {
  position: relative;
  overflow: hidden;
}
.tab.active::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  border-radius: inherit;
  background: linear-gradient(
    110deg,
    transparent 35%,
    color-mix(in srgb, #fff 55%, transparent) 50%,
    transparent 65%
  );
  transform: translateX(-130%);
  animation: 6s ease-in-out infinite tabSheen;
}
@keyframes tabSheen {
  0%,
  72% {
    transform: translateX(-130%);
  }
  100%,
  88% {
    transform: translateX(130%);
  }
}
.confetti {
  position: fixed;
  z-index: 95;
  width: 9px;
  height: 9px;
  border-radius: 2px;
  pointer-events: none;
  animation: confPop 1s var(--ease-out) forwards;
}
@keyframes confPop {
  0% {
    transform: translate(0, 0) rotate(0);
    opacity: 1;
  }
  100% {
    transform: translate(var(--dx), var(--dy)) rotate(var(--r));
    opacity: 0;
  }
}

.bar-line-btn {
  cursor: pointer;
  background: none;
  border: none;
  padding: 0;
  font: inherit;
  text-align: left;
  width: 100%;
  display: flex;
  align-items: center;
  gap: 8px;
  border-radius: var(--r-sm);
}
.bar-line-btn:hover {
  background: var(--surface-2);
}
.bar-line.overload .bl-lbl {
  color: var(--bad);
}
.kcard-quick {
  position: absolute;
  top: 8px;
  right: 8px;
  display: flex;
  gap: 4px;
  opacity: 0;
  transform: translateY(-2px);
  transition:
    opacity 0.15s ease,
    transform 0.15s ease;
  z-index: 2;
}
.kcard:hover .kcard-quick,
.kcard:focus-within .kcard-quick {
  opacity: 1;
  transform: translateY(0);
}
.kq-btn {
  width: 26px;
  height: 26px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--surface);
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  font-size: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--ink-soft);
}
.kq-btn:hover {
  background: var(--surface-2);
  color: var(--ink);
}
.kq-del:hover {
  color: #fff;
  background: var(--bad);
  border-color: var(--bad);
}
.kcol-load {
  height: 4px;
  border-radius: 999px;
  background: var(--surface-2);
  overflow: hidden;
  margin: 2px 2px 8px;
}
.kcol-load-bar {
  height: 100%;
  border-radius: 999px;
  transition: width 0.25s ease;
}
.snackbar {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%) translateY(16px);
  background: var(--coto-navy);
  color: #fff;
  padding: 10px 12px 10px 16px;
  border-radius: var(--pill);
  box-shadow: var(--shadow-lg);
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 13px;
  font-weight: 600;
  opacity: 0;
  pointer-events: none;
  transition:
    opacity 0.2s ease,
    transform 0.2s ease;
  z-index: 95;
}
.snackbar.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
  pointer-events: auto;
}
.snackbar .btn {
  background: rgba(255, 255, 255, 0.16);
  border-color: transparent;
  color: #fff;
}
.ctxmenu {
  position: fixed;
  z-index: 96;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  box-shadow: var(--shadow-lg);
  padding: 6px;
  display: flex;
  flex-direction: column;
  min-width: 190px;
}
.ctxmenu button {
  border: none;
  background: none;
  text-align: left;
  padding: 8px 10px;
  border-radius: 8px;
  font-size: 13px;
  cursor: pointer;
  color: var(--ink);
}
.ctxmenu button:hover {
  background: var(--surface-2);
}
.datepresets {
  display: flex;
  gap: 4px;
  margin-top: 6px;
}
.dp-btn {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 999px;
  padding: 3px 9px;
  font-size: 11px;
  cursor: pointer;
  color: var(--ink-soft);
}
.dp-btn:hover {
  background: var(--surface-2);
  color: var(--ink);
}
.throughput-row {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  height: 72px;
  padding-top: 6px;
}
.tp-bar-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  height: 100%;
  gap: 4px;
}
.tp-bar {
  width: 100%;
  max-width: 22px;
  border-radius: 5px 5px 0 0;
  background: var(--coto-blue);
}
.tp-n {
  font-size: 10px;
  color: var(--ink-soft);
  font-weight: 700;
}
.sync-ago {
  opacity: 0.75;
  font-weight: 500;
}
.gotop {
  position: fixed;
  right: 26px;
  bottom: 96px;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: none;
  background: var(--coto-navy);
  color: #fff;
  font-size: 18px;
  cursor: pointer;
  box-shadow: var(--shadow-lg);
  opacity: 0;
  transform: translateY(8px);
  pointer-events: none;
  transition:
    opacity 0.2s ease,
    transform 0.2s ease;
  z-index: 40;
}
.gotop.show {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}
.gotop:hover {
  background: var(--coto-blue);
}
.coachcard {
  position: fixed;
  right: 22px;
  bottom: 78px;
  max-width: 320px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-l);
  box-shadow: var(--shadow-lg);
  padding: 16px;
  opacity: 0;
  transform: translateY(10px);
  transition:
    opacity 0.25s ease,
    transform 0.25s ease;
  z-index: 90;
}
.coachcard.show {
  opacity: 1;
  transform: translateY(0);
}
.coachcard-t {
  font-weight: 700;
  margin-bottom: 8px;
  font-size: 13px;
}
.coachcard-l {
  margin: 0 0 12px;
  padding-left: 18px;
  font-size: 12.5px;
  color: var(--ink-soft);
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.panel-menu-wrap {
  position: relative;
}
.panel-menu {
  display: none;
  position: absolute;
  right: 0;
  bottom: calc(100% + 6px);
  min-width: 200px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  box-shadow: var(--shadow-lg);
  padding: 6px;
  flex-direction: column;
  z-index: 10;
}
.panel-menu-wrap.open .panel-menu {
  display: flex;
}
.ultimo-toco {
  display: block;
  margin-top: 2px;
  font-size: 11px;
  font-weight: 600;
  opacity: 0.85;
}
@media (max-width: 860px) {
  .gotop {
    right: 16px;
    bottom: 156px;
  }
  .coachcard {
    right: 14px;
    left: 14px;
    max-width: none;
    bottom: 84px;
  }
}
/* Máquina de la suerte: un botón flotante fijo al centro-derecha de la
   pantalla; al tocarlo abre el juego como popup centrado (reutiliza el
   modal existente), con 3 rodillos que frenan en cascada. */
.slot-fab {
  position: fixed;
  right: 22px;
  top: 50%;
  transform: translateY(-50%);
  width: 64px;
  height: 64px;
  border-radius: 50%;
  border: none;
  font-size: 28px;
  display: grid;
  place-content: center;
  cursor: pointer;
  z-index: 39;
  transition:
    transform 0.15s ease,
    box-shadow 0.15s ease;
  background: linear-gradient(145deg, #ffd76a, #e8a815);
  color: #3a2600;
  box-shadow:
    0 6px 18px rgba(232, 168, 21, 0.5),
    inset 0 1px 0 rgba(255, 255, 255, 0.6);
}
.slot-fab:hover {
  box-shadow:
    0 8px 22px rgba(232, 168, 21, 0.6),
    inset 0 1px 0 rgba(255, 255, 255, 0.6);
  transform: translateY(-50%) scale(1.08);
}
.slot-fab:active {
  transform: translateY(-50%) scale(0.95);
}
/* Cartelito con la CotoFrase del día + mini ranking del equipo. Vive en el
   flujo normal de Inicio (no position:fixed) para que nunca tape las
   tarjetas del hub, sea cual sea el alto de la ventana. */
.frase-widget {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin: 0 0 20px;
}
.frase-widget[hidden] {
  display: none;
}
.frase-mia {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 4px;
  padding: 10px 16px;
  border-radius: var(--r-l);
  background: linear-gradient(145deg, #ffd76a, #e8a815);
  color: #3a2600;
  box-shadow:
    0 6px 18px rgba(232, 168, 21, 0.4),
    inset 0 1px 0 rgba(255, 255, 255, 0.6);
}
.frase-mia-tag {
  font-size: 10.5px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  opacity: 0.75;
}
.frase-mia-txt {
  font-size: 13px;
  font-weight: 700;
  line-height: 1.3;
}
.frase-rank {
  flex: 1;
  min-width: 200px;
  max-width: 320px;
  max-height: 96px;
  overflow-y: auto;
  padding: 8px 12px;
  border-radius: var(--r-l);
  background: var(--surface);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
}
.frase-rank-t {
  font-size: 10.5px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  color: var(--ink-soft);
  margin-bottom: 4px;
}
.frase-rank-row {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-size: 11.5px;
  padding: 3px 0;
  border-top: 1px solid var(--line);
}
.frase-rank-row:first-of-type {
  border-top: none;
}
.frase-rank-n {
  font-weight: 700;
  color: var(--ink);
  flex: none;
}
.frase-rank-f {
  color: var(--ink-soft);
  text-align: right;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
@media (max-width: 860px) {
  .frase-widget {
    flex-direction: column;
  }
  .frase-rank {
    max-width: none;
  }
}
.slot-modal {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  text-align: center;
  padding: 4px 4px 8px;
}
.slot-modal-t {
  font-size: 19px;
  font-weight: 800;
}
.slot-modal-d {
  font-size: 12.5px;
  color: var(--ink-soft);
  margin-top: -10px;
}
.slot-reels {
  display: flex;
  gap: 10px;
  padding: 16px;
  border-radius: var(--r-l);
  background: linear-gradient(160deg, #1b1300, #2c1f00);
  border: 3px solid #e8a815;
  box-shadow:
    inset 0 2px 10px rgba(0, 0, 0, 0.6),
    0 8px 24px rgba(232, 168, 21, 0.25);
}
.slot-reel {
  width: 64px;
  height: 64px;
  background: linear-gradient(180deg, #fffdf5, #f3e9c9);
  border-radius: var(--r-sm);
  display: grid;
  place-content: center;
  font-size: 32px;
  box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.08);
}
.slot-reel.stop {
  animation: slot-reel-stop 0.3s ease;
}
@keyframes slot-reel-stop {
  0% {
    transform: scale(1.15) rotate(-3deg);
  }
  60% {
    transform: scale(0.95) rotate(2deg);
  }
  100% {
    transform: scale(1) rotate(0);
  }
}
.slot-result {
  min-height: 22px;
  font-size: 15px;
  font-weight: 800;
  color: var(--ink);
  opacity: 0;
  transform: translateY(6px);
  transition:
    opacity 0.25s ease,
    transform 0.25s ease;
}
.slot-result.show {
  opacity: 1;
  transform: translateY(0);
}
.slot-lever {
  align-self: center;
  border: none;
  background: linear-gradient(180deg, #ff5a5a, #c81e1e);
  color: #fff;
  font-weight: 800;
  font-size: 13.5px;
  padding: 12px 24px;
  border-radius: var(--pill);
  cursor: pointer;
  box-shadow:
    0 5px 0 #8f1414,
    0 8px 18px rgba(200, 30, 30, 0.4);
  transition:
    transform 0.08s ease,
    box-shadow 0.08s ease;
}
.slot-lever:hover {
  transform: translateY(-1px);
}
.slot-lever:active {
  transform: translateY(3px);
  box-shadow:
    0 2px 0 #8f1414,
    0 4px 10px rgba(200, 30, 30, 0.4);
}
.slot-lever:disabled {
  opacity: 0.65;
  cursor: default;
  transform: none;
}
@media (max-width: 860px) {
  .slot-fab {
    right: 14px;
    width: 54px;
    height: 54px;
    font-size: 23px;
  }
}
/* ¿Qué curso me toca?: ruleta arriba, al centro, del Planner — solo cursos

  margin: 2px 0 16px;
}
.roulette-btn {
  border: none;

  font-size: 13.5px;

.roulette-modal-t {

.roulette-wrap {

.roulette-pointer {

.roulette-wheel {

  pointer-events: none;
}
.roulette-hub {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 22px;
  height: 22px;

.roulette-result {

.roulette-spin {

  color: #fff;
  font-weight: 800;
  font-size: 13.5px;
  padding: 12px 24px;
  border-radius: var(--pill);
  cursor: pointer;
  box-shadow:
    0 5px 0 #146552,
    0 8px 18px rgba(28, 143, 112, 0.4);

<div class="aurora" aria-hidden="true"></div>

<!-- GATE: identificación por nombre -->
<div id="gate" class="gate">
  <div class="gate-card">
    <div class="logo-slot" style="margin-bottom:18px"></div>
    <h1>Cotonetes Forever</h1>
    <p>COTO Aprendizaje e-Learning. Identificate para que el equipo vea lo que cargás.</p>
    <div class="gate-team" id="gateTeam"></div>
    <input id="gatePassInput" type="password" placeholder="🔑 Clave de ingreso" class="gate-passinput hidden" autocomplete="current-password" />
    <div class="gate-other">
      <input id="gateInput" placeholder="...o escribí tu nombre" />
      <button class="btn btn-primary" data-action="gate:enter">Entrar</button>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app" class="app hidden">
  <header class="topbar">
    <div class="brand" data-action="hub:go" data-go="inicio" title="Ir al inicio">
      <div class="logo-slot"></div>
      <div class="brand-t">Cotonetes Forever</div>
    </div>
    <nav class="tabs">
      <button class="tab" data-view="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg> Inicio</button>
      <button class="tab" data-view="resumen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V11M9.3 20V5M14.6 20v-6M20 20v-9"/></svg> Resumen</button>
      <span class="sep"></span>
      <button class="tab" data-view="kanban"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4v16M12 4v11M19 4v13"/></svg> Planner</button>
      <button class="tab" data-view="calendario"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg> Calendario</button>
      <button class="tab" data-view="timeline"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M8 12h11M4 17h7"/></svg> Timeline</button>
      <button class="tab" data-view="agenda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4c4.4 0 8 2.7 8 6H4c0-3.3 3.6-6 8-6z"/><path d="M12 10v9"/><path d="M12 19a2.2 2.2 0 0 0 3.2-.8"/></svg> Agenda</button>
      <span class="sep"></span>
      <button class="tab" data-view="mapa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3.5 6v14L9 18l6 2 5.5-2V4L15 6 9 4z"/><path d="M9 4v14M15 6v14"/></svg> Mapa</button>
    </nav>
    <div class="top-actions">

        <button class="ticon" data-action="notif:open" id="notifBtn" title="Alertas" aria-label="Alertas" style="position:relative"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 5 1.8 6 1.8 6H4.2S6 14 6 9"/><path d="M10 19a2 2 0 0 0 4 0"/></svg><span id="notifBadge" class="notif-badge hidden"></span></button>
        <button class="ticon" data-action="theme:toggle" title="Modo oscuro/claro" id="themeBtn" aria-label="Tema"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
      </div>
      <div class="menu-wrap">
        <div class="userchip" data-action="menu:toggle" id="userChip"></div>
        <div class="menu hidden" id="userMenu" role="menu">

          <button class="menu-item" data-action="settings:open"><span>⚙</span> Ajustes y datos</button>
          <div class="menu-sep"></div>
          <button class="menu-item" data-action="user:logout"><span>⎋</span> Salir</button>
        </div>
      </div>
    </div>
  </header>
  <div class="filters" id="filters"></div>
  <main id="view" class="view"><div class="spinner"></div></main>
  <div id="banner"></div>
  <footer class="appfoot">
    <div class="appfoot-in">
      <div class="appfoot-brand">
        <div class="logo-slot"></div>
        <div class="appfoot-txt">
          <div class="appfoot-name">Cotonetes Forever</div>
          <div class="appfoot-tag">COTO · Aprendizaje e-Learning</div>
        </div>
      </div>
      <div class="appfoot-meta">
        <span class="appfoot-pill">✦ Planificación del equipo</span>
        <span>Hecho con 💙 por e-Learning</span>
        <span class="appfoot-dot">·</span>
        <span id="footYear">2026</span>
      </div>

// Los 3 rodillos frenan en cascada (500 / 800 / 1150ms) para que se sienta
// como una tragamonedas de verdad y no un simple sorteo instantáneo.
function tirarSlot() {
  const reels = [1, 2, 3].map((n) => $("#slotReel" + n)),
    resultado = $("#slotResult"),
    boton = $("#slotLever");
  if (!reels[0] || reels[0].dataset.spinning) return;
  (reels.forEach((r) => (r.dataset.spinning = "1")),
    boton && (boton.disabled = true),
    resultado && (resultado.classList.remove("show"), (resultado.textContent = "")));
  const paradas = [500, 800, 1150];
  reels.forEach((reel, i) => {
    const timer = setInterval(() => {
      reel.textContent = SLOT_SIMBOLOS[Math.floor(Math.random() * SLOT_SIMBOLOS.length)];
    }, 60);
    setTimeout(() => {
      (clearInterval(timer),
        (reel.textContent = SLOT_SIMBOLOS[Math.floor(Math.random() * SLOT_SIMBOLOS.length)]),
        delete reel.dataset.spinning,
        reel.classList.add("stop"),
        setTimeout(() => reel.classList.remove("stop"), 300));
      if (i === reels.length - 1) {
        ensureFraseDay();
        const frase = SLOT_FRASES[Math.floor(Math.random() * SLOT_FRASES.length)];
        ((state.cotofrase.porUsuario[state.user] = frase), touch());
        (resultado && ((resultado.textContent = frase), resultado.classList.add("show")),
          boton && (boton.remove()));
        renderFraseWidget();
      }
    }, paradas[i]);
  });
}

function tirarRuleta() {

    resultado = $("#rouletteResult"),
    boton = $("#rouletteSpin"),
    pendientes = cursosPendientes();

    segAngle = 360 / n,
    idx = Math.floor(Math.random() * n),
    elegido = pendientes[idx],
    centerAngle = idx * segAngle + segAngle / 2,
    prevRot = parseFloat(wheel.dataset.rot || "0"),
    vueltas = 5 + Math.floor(Math.random() * 3),
    finalMod = (360 - centerAngle) % 360,

    nuevoRot = prevRot + vueltas * 360 + delta;

    (wheel.dataset.rot = String(nuevoRot)),
    boton && (boton.disabled = true),
    resultado && (resultado.classList.remove("show"), (resultado.innerHTML = "")),
    (wheel.style.transform = "rotate(" + nuevoRot + "deg)"));

    (delete wheel.dataset.spinning,
      resultado &&
        (resultado.classList.add("show"),
        (resultado.innerHTML =

          esc(elegido.titulo) +

          elegido.id +
          '">Abrir tarjeta</button>')),
      boton && (boton.disabled = false));
  }, 3200);
}

function kpiSnapKey() {

// Sin histórico en el backend compartido: el snapshot vive solo en este
// navegador (localStorage), así que la variación es una referencia local,
// no un dato sincronizado entre el equipo.
function kpiTrendHTML(key, actual) {
  try {
    const raw = localStorage.getItem(kpiSnapKey());
    if (!raw) return "";
    const snaps = JSON.parse(raw),
      hace7 = isoOf(addDays(new Date(), -7)),
      entry = snaps[hace7];
    if (!entry || entry[key] == null) return "";
    const diff = actual - entry[key];
    if (!diff) return '<div class="kpi-trend flat">= vs. semana pasada</div>';
    return (
      '<div class="kpi-trend ' +
      (diff > 0 ? "up" : "down") +
      '">' +
      (diff > 0 ? "▲ +" + diff : "▼ " + diff) +
      " vs. semana pasada</div>"
    );
  } catch (e) {
    return "";
  }
}
function saveKpiSnapshot(map) {
  try {
    const raw = localStorage.getItem(kpiSnapKey()),
      snaps = raw ? JSON.parse(raw) : {},
      hoy = todayISO(),
      corte = isoOf(addDays(new Date(), -30));
    snaps[hoy] = map;
    Object.keys(snaps).forEach((k) => {
      if (k < corte) delete snaps[k];
    });
    localStorage.setItem(kpiSnapKey(), JSON.stringify(snaps));
  } catch (e) {}
}
function weekStartISO(d) {

    dia = (dt.getDay() + 6) % 7;

}

  state.cards.forEach((tarjeta) => {
    (tarjeta.actividad || []).forEach((entrada) => {
      if (!/pasó a en revisión/i.test(entrada.texto || "")) return;
