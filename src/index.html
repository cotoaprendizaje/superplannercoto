<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Cotonetes Forever · COTO Aprendizaje e-Learning</title>
<meta name="theme-color" content="#006EA0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Cotonetes" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="assets/icon-192.png" />

<!--
================================================================================
  COTONETES FOREVER · Aprendizaje e-Learning · RRHH COTO CICSA
  Fase 1 — Tablero (Kanban / Calendario / Timeline) + Mapa > Cursos
================================================================================
  VISIÓN (documentada, ejecución acotada a Fase 1):

  DOS PLANOS CONECTADOS
  - TABLERO  = "lo que hacemos": proyectos/tareas en movimiento.
  - MAPA     = "lo que tenemos": inventario navegable (Fase 1: Cursos).
  - PUENTE   = ciclo de vida: una tarjeta es UN objeto; su plano se DERIVA
               del estado. Un curso del tablero, al publicarse, aparece en el
               inventario; si necesita actualización vuelve al tablero. No se
               duplica data, se mueve la misma tarjeta entre vistas.

  MODELO: 3 EJES INDEPENDIENTES que se combinan
  - TIPO   -> trae una PLANTILLA editable (fases + checklist). Punto de partida.
  - ESTADO -> pendiente | en-desarrollo | en-revision | finalizado.
  - SECTOR -> sectores[] (uno o varios). Color vía data-cat (modelo Edu Point).

  SECCIONES DEL MAPA aún vacías (estructura lista p/ fases siguientes):
  apps web · QR/Edu Point inventario · bases del sistema.

  PERSISTENCIA: window.storage { shared:true }. Sin localStorage/sessionStorage.
  Identificación por nombre al entrar. try/catch + estados de carga.
  Fallback en memoria (modo demo) si window.storage no existe.
================================================================================
-->

<!-- @@STYLES@@ -->
</head>
<body>
<div class="aurora" aria-hidden="true"></div>

<!-- GATE: ingreso con la cuenta de cada persona -->
<div id="gate" class="gate">
  <div class="gate-card">
    <div class="logo-slot" style="margin-bottom:18px"></div>
    <h1>Cotonetes Forever</h1>
    <p>COTO Aprendizaje e-Learning. Entrá con tu cuenta.</p>
    <form id="gateForm" class="gate-form">
      <input id="gateMail" type="email" placeholder="✉ Tu mail" autocomplete="username" spellcheck="false" />
      <input id="gatePassInput" type="password" placeholder="🔑 Tu contraseña" autocomplete="current-password" />
      <button class="btn btn-primary" type="submit">Entrar</button>
    </form>
    <div id="gateMsg" class="gate-msg" hidden></div>
  </div>
</div>

<!-- APP -->
<div id="app" class="app hidden">
  <div id="printMeta" class="print-meta"></div>
  <header class="topbar">
    <div class="brand" data-action="hub:go" data-go="inicio" title="Ir al inicio">
      <div class="logo-slot" data-brand></div>
    </div>
    <nav class="tabs">
      <button class="tab" data-view="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.9 12 3.4l9 7.5"/><path d="M5.7 9.7v10.7h12.6V9.7"/></svg> Inicio</button>
      <span class="sep"></span>
      <button class="tab" data-view="kanban"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.6"/><path d="M9 4v16M15 4v16"/></svg> Planner</button>
      <button class="tab" data-view="calendario"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5.2" width="18" height="15.8" rx="2.6"/><path d="M3 10.2h18"/><path d="M8.2 3v4.4M15.8 3v4.4"/></svg> Calendario</button>
      <button class="tab" data-view="timeline"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 6h10M8.5 12h12M3.5 18h7"/></svg> Timeline</button>
      <span class="sep"></span>
      <button class="tab" data-view="mapa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.9 3 7.8l9 4.9 9-4.9-9-4.9Z"/><path d="m3 12.2 9 4.9 9-4.9"/><path d="m3 16.1 9 4.9 9-4.9"/></svg> Mapa</button>
      <button class="tab" data-view="tecnico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.6 8h5.7M14.7 8h5.7M3.6 16h8.7M17.7 16h2.7"/><circle cx="12" cy="8" r="2.7"/><circle cx="15" cy="16" r="2.7"/></svg> Técnico</button>
      <span class="sep"></span>
      <button class="tab" data-view="reportes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.4 20.6h17.2"/><path d="M4 15.6 9 10.4l4 3.4 6.6-7.4"/><path d="M16 5.7h3.6v3.6"/></svg> Reportes</button>
    </nav>
    <button class="search-promo" data-action="search:open" title="Buscar (tecla / o Ctrl+K)" aria-label="Buscar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.8" cy="10.8" r="7"/><path d="m20.4 20.4-4.6-4.6"/></svg>
      <span class="search-promo-t">Buscar tarjetas, cursos…</span>
      <kbd class="search-promo-k">Ctrl K</kbd>
    </button>
    <div class="top-actions">
      <div class="top-tools">
        <button class="ticon" data-action="notif:open" id="notifBtn" title="Alertas" aria-label="Alertas" style="position:relative"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.2 9a5.8 5.8 0 0 1 11.6 0c0 4.8 1.8 5.9 1.8 5.9H4.4S6.2 13.8 6.2 9Z"/><path d="M10 18.6a2 2 0 0 0 4 0"/></svg><span id="notifBadge" class="notif-badge hidden"></span></button>
        <button class="ticon" data-action="theme:toggle" title="Modo oscuro/claro" id="themeBtn" aria-label="Tema"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.7 13.1A8.9 8.9 0 1 1 10.9 3.3a7 7 0 0 0 9.8 9.8Z"/></svg></button>
        <button class="ticon" data-action="help:open" title="Ayuda" aria-label="Ayuda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.4 9.4a2.7 2.7 0 1 1 3.9 2.4c-1 .5-1.3 1.1-1.3 2.1v.3"/><circle cx="12" cy="17.3" r="1.1" fill="currentColor" stroke="none"/></svg></button>
      </div>
      <div class="menu-wrap">
        <div class="userchip" data-action="menu:toggle" id="userChip"></div>
        <!--
          Era una lista de cinco renglones planos con un emoji suelto adelante:
          "Mi semana" (que es tu trabajo) y "Ajustes y datos" (que es la
          administración del área) pesaban exactamente lo mismo. Ahora arriba
          está quién sos, y abajo los dos grupos separados: lo tuyo primero,
          las herramientas después, y Salir aparte al final.
        -->
        <div class="menu hidden" id="userMenu" role="menu">
          <div class="menu-yo" id="menuYo"></div>
          <div class="menu-grupo">Tu trabajo</div>
          <button class="menu-item" data-action="misemana:open"><span class="menu-ic">📅</span><span class="menu-tx">Mi semana<i>Tu foco de los próximos días</i></span></button>
          <button class="menu-item" data-action="carga:open"><span class="menu-ic">👥</span><span class="menu-tx">Carga del equipo<i>Quién tiene qué encima</i></span></button>
          <div class="menu-grupo">Herramientas</div>
          <button class="menu-item" data-action="app:print"><span class="menu-ic">🖨️</span><span class="menu-tx">Imprimir / PDF<i>Lo que estás viendo en pantalla</i></span></button>
          <button class="menu-item" data-action="settings:open"><span class="menu-ic">⚙</span><span class="menu-tx">Ajustes y datos<i>Equipo, sectores y respaldos</i></span></button>
          <div class="menu-sep"></div>
          <button class="menu-item menu-salir" data-action="user:logout"><span class="menu-ic">🚪</span><span class="menu-tx">Salir</span></button>
        </div>
      </div>
    </div>
  </header>
  <main id="view" class="view"><div class="spinner"></div></main>
  <div id="hubSide" class="hub-side" hidden></div>
  <div id="banner"></div>
  <footer class="appfoot">
    <div class="appfoot-in">
      <div class="appfoot-brand">
        <div class="logo-slot"></div>
        <div class="appfoot-txt">
          <div class="appfoot-name">Cotonetes Forever</div>
          <div class="appfoot-tag">COTO · Aprendizaje e-Learning</div>
        </div>
      </div>
      <div class="appfoot-meta">
        <span class="appfoot-pill">✦ Planificación del equipo</span>
        <span>Hecho con 💙 por e-Learning</span>
        <span class="appfoot-dot">·</span>
        <span id="footYear">2026</span>
      </div>
    </div>
  </footer>
  <button class="fab" data-action="nuevo:open" title="Nueva tarjeta (n)" aria-label="Nueva tarjeta">+</button>
</div>

<!-- Panel lateral + overlay + modal -->
<div id="overlay" class="overlay hidden" data-action="panel:close"></div>
<aside id="panel" class="panel"></aside>
<div id="modal" class="modal-wrap hidden"></div>

<!-- @@SCRIPT@@ -->
</body>
</html>
